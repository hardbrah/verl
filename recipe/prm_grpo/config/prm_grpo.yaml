# PRM-GRPO Training Configuration
# This extends the standard PPO trainer config with PRM-specific settings.

# Inherit defaults from the standard PPO trainer
# Note: verl's config search path is registered via SearchPathPlugin in main_prm_grpo.py
defaults:

  # Actor config (from verl's actor folder)
  - actor@actor_rollout_ref.actor: dp_actor

  # Data config (from verl's data folder)
  - data@data: legacy_data

  # Reward manager config (for rule-based rewards, not used in PRM-GRPO)
  - reward_manager@reward_manager

  # Reference model config (from verl's ref folder)
  - ref@actor_rollout_ref.ref: dp_ref

  # Rollout model config (from verl's rollout folder)
  - rollout@actor_rollout_ref.rollout: rollout

  # Model config (from verl's model folder)
  - model@actor_rollout_ref.model: hf_model

  # Critic model config (not used in GRPO, but keep for compatibility)
  - critic@critic: dp_critic

  # Reward model config - use local prm_reward_model.yaml
  - reward_model@reward_model: prm_reward_model

  # Rollout correction config (from verl's algorithm folder)
  - algorithm@algorithm.rollout_correction: rollout_correction

  # Load self config last
  - _self_

# config for actor, rollout and reference model
actor_rollout_ref:

  # Whether it's a hybrid engine
  hybrid_engine: true

  # Timeout for NCCL operations
  nccl_timeout: 600

  # Rollout config
  rollout:
    layered_summon: False

# custom reward function definition (not used in PRM-GRPO, rewards come from PRM)
custom_reward_function:
  path: null
  name: compute_score

# Algorithm config
algorithm:

  _target_: verl.trainer.config.AlgoConfig

  # GRPO settings
  gamma: 1.0
  lam: 1.0
  
  # Use GRPO advantage estimator
  adv_estimator: grpo
  
  # GRPO-specific settings
  norm_adv_by_std_in_grpo: True
  
  # KL settings
  use_kl_in_reward: False
  kl_penalty: low_var_kl
  
  kl_ctrl:
    _target_: verl.trainer.config.KLControlConfig
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1

  use_pf_ppo: False

# Trainer config
trainer:

  balance_batch: True
  total_epochs: 15
  total_training_steps: null
  
  # Project and experiment names
  project_name: verl_prm_grpo
  experiment_name: prm_grpo
  
  logger: ["console", "wandb"]
  log_val_generations: 0
  rollout_data_dir: null
  validation_data_dir: null
  
  # Distributed settings
  nnodes: 1
  n_gpus_per_node: 8
  
  # Checkpointing
  save_freq: 20
  esi_redundant_time: 0
  resume_mode: disable
  resume_from_path: null
  
  # Validation
  val_before_train: True
  val_only: False
  test_freq: 5
  
  # Critic warmup (not used in GRPO)
  critic_warmup: 0
  
  default_hdfs_dir: null
  del_local_ckpt_after_load: False
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  
  ray_wait_register_center_timeout: 300
  device: cuda
  use_legacy_worker_impl: auto

# Profiler config
global_profiler:
  _target_: verl.utils.profiler.ProfilerConfig
  tool: null
  steps: null
  profile_continuous_steps: False
  save_path: "outputs/profile"
  global_tool_config:
    nsys:
      _target_: verl.utils.profiler.config.NsightToolConfig
      discrete: False
      controller_nsight_options:
        trace: "cuda,nvtx,cublas,ucx"
        cuda-memory-usage: "true"
        cuda-graph-trace: "graph"
      worker_nsight_options:
        trace: "cuda,nvtx,cublas,ucx"
        cuda-memory-usage: "true"
        cuda-graph-trace: "graph"
        capture-range: "cudaProfilerApi"
        capture-range-end: null
        kill: none
    torch_memory:
      trace_alloc_max_entries: 100_000
      stack_depth: 32
      context: "all"
      stacks: "all"
      kw_args: {}

# Transfer queue config
transfer_queue:
  enable: False

# Ray kwargs
ray_kwargs:
  ray_init:
    num_cpus: null
  timeline_json_file: null
